name: Silicon Agent CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-compile:
    name: Lint and Compile SystemVerilog
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Icarus Verilog
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog
        
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run linter (verilator)
      run: |
        sudo apt-get install -y verilator
        verilator --lint-only src/*.sv src/*.svh testbench/*.sv || true
        
    - name: Compile RTL
      run: make compile
      
    - name: Compile with modular testbench
      run: make compile_modular
      
  simulation-tests:
    name: Run Simulation Tests
    runs-on: ubuntu-latest
    needs: lint-and-compile
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Icarus Verilog
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog
        
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run basic simulation
      run: make sim
      
    - name: Run modular testbench simulation
      run: make sim_modular
      
    - name: Upload waveform artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: waveforms
        path: |
          *.vcd
          *.fst
        retention-days: 7
        
  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: simulation-tests
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Icarus Verilog
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog
        
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run simulation with coverage
      run: make verify_modular
      
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.html
          *.log
        retention-days: 14

  behavioral-model-test:
    name: Test Python Behavioral Model
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run behavioral model tests
      run: |
        cd scripts
        python behavioral_model.py --test || python behavioral_model.py
