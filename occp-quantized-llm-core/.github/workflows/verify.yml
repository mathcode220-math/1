name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Unit and regression
        run: make test
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Check claims
        run: make verify
        env:
          PYTHONPATH: ${{ github.workspace }}
