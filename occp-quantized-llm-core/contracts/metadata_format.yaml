# ============================================================
# metadata_format.yaml
# .bin model-file header specification for the quantized model
# ============================================================
metadata_format:
  version: 1
  byte_order: little_endian
  header_size_bytes: 8
  alignment: "8 bytes = 1 AXI4-Lite word"

  fields:
    - name: total_layers
      offset: 0
      size: 1
      type: uint8
      range: [1, 128]
      description: "Total number of layers in the model"

    - name: layer_weight_bytes
      offset: 1
      size: 3
      type: uint24
      description: "Weight size of one layer, in bytes"

    - name: activation_kind
      offset: 4
      size: 1
      type: uint8
      enum:
        relu: 0
        gelu: 1
        silu: 2
        tanh: 3
        softmax: 4

    - name: vector_len
      offset: 5
      size: 2
      type: uint16
      description: "Input vector dimension"

    - name: reserved
      offset: 7
      size: 1
      type: uint8
      description: "Reserved for future use, must be zero"

  payload:
    layout: "layer_0_weights || layer_1_weights || ... || layer_N_weights"
    encoding: "row-major int8"
